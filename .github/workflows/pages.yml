name: 发布到 GitHub Pages

on:
  push:
    branches:
      - main
      - claude/mouse-draw-duck-game-ppsvsi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 开通并配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 整理站点文件
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r one-stroke-duck _site/

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
